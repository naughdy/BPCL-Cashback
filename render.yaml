# Render Blueprint for the backend API.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In the Render dashboard: New > Blueprint > select this repo.
#      Render reads this file and creates the service below automatically.
#   3. Render will prompt you to fill in the "sync: false" env vars
#      (DATABASE_URL, JWT_SECRET, etc.) — it never invents secrets for you.
#   4. Point DATABASE_URL at your Neon (or other) Postgres connection
#      string — see /HOSTING.md for the exact steps.
#
# This deploys the /backend Dockerfile as-is: on every deploy it runs
# `prisma migrate deploy` then starts the API (see backend/Dockerfile).

services:
  - type: web
    name: bpcl-cashback-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free # switch to "starter" ($7/mo) to avoid cold starts on every idle request
    region: singapore # closest Render region to India as of writing; check Render's region list for the current closest option
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      - key: DATABASE_URL
        sync: false # paste your Neon/Postgres connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret for you
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: OTP_PROVIDER
        value: MOCK # change to MSG91 once you have real credentials, then add the MSG91_* vars below
      - key: WHATSAPP_PROVIDER
        value: MOCK
      - key: READER_PROVIDER
        value: MOCK
      - key: OTP_EXPIRY_MINUTES
        value: '5'
      - key: OTP_MAX_ATTEMPTS
        value: '5'
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: '30'
      - key: CORS_ORIGIN
        sync: false # set to your admin-web URL once deployed, e.g. https://bpcl-admin.pages.dev
      # Uncomment once you're ready to switch OTP_PROVIDER to MSG91:
      # - key: MSG91_AUTH_KEY
      #   sync: false
      # - key: MSG91_TEMPLATE_ID
      #   sync: false
      # - key: MSG91_SENDER_ID
      #   sync: false
